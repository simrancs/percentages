<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Master v5</title>
    <style>
        /* Sleek Grey/Black Dark Theme */
        :root {
            --bg: #09090b;          
            --surface: #18181b;     
            --surface-hover: #27272a; 
            --primary: #3b82f6;     
            --primary-hover: #2563eb;
            --success: #10b981;     
            --danger: #f43f5e;      
            --warning: #f59e0b;     
            --text: #fafafa;        
            --text-muted: #a1a1aa;  
            --border: #27272a;      
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 1rem; 
        }
        
        .container { 
            background: var(--surface); 
            border-radius: 12px; 
            padding: 2.5rem; 
            width: 100%; 
            max-width: 900px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
            border: 1px solid var(--border); 
        }
        
        h1 { 
            text-align: center; 
            margin-bottom: 0.5rem; 
            color: var(--text); 
            font-size: 2.2rem; 
            letter-spacing: -0.5px;
        }
        
        p.subtitle { 
            text-align: center; 
            color: var(--text-muted); 
            margin-bottom: 2.5rem; 
            font-size: 1rem; 
        }
        
        #start-screen, #quiz-screen, #result-screen { display: none; }
        #start-screen.active, #quiz-screen.active, #result-screen.active { display: block; animation: fadeIn 0.3s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 0.875rem 1.5rem; 
            border-radius: 8px; 
            font-size: 1.05rem; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-weight: 600; 
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);
        }
        
        button:hover:not(:disabled) { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(59, 130, 246, 0.3);
        }
        
        button:disabled { 
            background: var(--surface-hover); 
            color: var(--text-muted);
            cursor: not-allowed; 
            box-shadow: none;
            transform: none;
        }
        
        .start-btn { display: block; width: 100%; padding: 1.25rem; font-size: 1.25rem; margin-top: 1.5rem; letter-spacing: 1px; text-transform: uppercase;}

        .settings { display: grid; grid-template-columns: 1fr; gap: 1.25rem; margin-bottom: 2.5rem; }
        .setting-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .setting-group label { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        
        select { 
            background: var(--bg); 
            border: 1px solid var(--border); 
            color: var(--text); 
            padding: 1rem; 
            border-radius: 8px; 
            outline: none; 
            font-size: 1rem; 
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a1a1aa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
            cursor: pointer;
        }
        select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 0.5rem; }
        .stat-badge { background: var(--bg); padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; border: 1px solid var(--border); font-size: 1.1rem; }
        .timer-box { color: var(--danger); font-variant-numeric: tabular-nums; }
        .streak-box { color: var(--warning); }
        .score-box { color: var(--success); }

        .pace-container { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; margin-bottom: 2rem; overflow: hidden; position: relative; border: 1px solid var(--border); }
        .pace-bar { height: 100%; width: 100%; background: var(--success); transition: width 1s linear, background-color 0.5s; }
        .pace-bar.warning { background: var(--warning); }
        .pace-bar.danger { background: var(--danger); }

        .question-box { font-size: 1.4rem; margin-bottom: 2rem; line-height: 1.6; min-height: 80px; font-weight: 500; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        
        .option-btn { 
            background: var(--surface-hover); 
            border: 2px solid var(--border); 
            color: var(--text); 
            text-align: left; 
            padding: 1.25rem; 
            font-size: 1.15rem; 
            border-radius: 10px;
            box-shadow: none;
            font-weight: 500;
        }
        
        .option-btn:hover:not(:disabled) { 
            background: var(--bg); 
            border-color: var(--primary); 
            transform: translateY(-2px);
        }
        
        .option-btn.correct { 
            background: rgba(16, 185, 129, 0.1); 
            border-color: var(--success); 
            color: var(--success);
        }
        
        .option-btn.wrong { 
            background: rgba(244, 63, 94, 0.1); 
            border-color: var(--danger); 
            color: var(--danger);
        }

        .concept-hint { color: var(--primary); font-size: 0.9rem; margin-bottom: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        #ui-explanation-box { display: none; background: rgba(59, 130, 246, 0.05); border-left: 4px solid var(--primary); padding: 1.25rem; border-radius: 0 8px 8px 0; margin-bottom: 1.5rem; font-size: 1.05rem; line-height: 1.6; border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);}
        
        .summary-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
        .stat-card { background: var(--surface-hover); padding: 1.5rem 1rem; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--text); margin-bottom: 0.25rem; }
        .stat-card .label { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;}

        .review-list { max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; padding-right: 0.5rem; margin-bottom: 2rem; }
        .review-list::-webkit-scrollbar { width: 8px; }
        .review-list::-webkit-scrollbar-track { background: var(--bg); border-radius: 4px; }
        .review-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .review-list::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        
        .review-item { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; border-left: 4px solid transparent; }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        .review-item.skipped { border-left-color: var(--text-muted); }
        
        .review-q { font-weight: 600; margin-bottom: 0.75rem; font-size: 1.15rem; }
        .review-a { font-size: 1rem; color: var(--text-muted); margin-bottom: 0.75rem; }
        .review-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; background: var(--surface); padding: 0.75rem; border-radius: 6px; margin-top: 1rem; border: 1px solid var(--border);}
        .speed-badge { padding: 0.25rem 0.6rem; border-radius: 4px; font-weight: 600;}
        .speed-fast { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .speed-ok { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .speed-slow { background: rgba(244, 63, 94, 0.15); color: var(--danger); }
        .explanation { margin-top: 0.5rem; font-size: 0.95rem; color: var(--text); border-top: 1px dashed var(--border); padding-top: 1rem; line-height: 1.5;}

        @media (max-width: 600px) {
            .options-grid, .summary-stats { grid-template-columns: 1fr 1fr; }
            .container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- START SCREEN -->
        <div id="start-screen" class="active">
            <h1>Percentage Master <span style="color: var(--primary)">v5</span></h1>
            <p class="subtitle">Procedurally generated infinite mathematics.</p>
            
            <div class="settings">
                <div class="setting-group">
                    <label>Learning Mode</label>
                    <select id="quiz-mode">
                        <option value="train" selected>Training (Instant Explanations & Adaptive)</option>
                        <option value="exam">Exam Sprint (Strict 30s/Q Auto-Skip)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Duration</label>
                    <select id="quiz-duration">
                        <option value="180">3 Minutes (Sprint)</option>
                        <option value="300" selected>5 Minutes (Standard Practice)</option>
                        <option value="600">10 Minutes (Endurance)</option>
                        <option value="999999">No Timer (Learn & Explore)</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Topic Selection</label>
                    <select id="quiz-concept">
                        <option value="all" selected>🌟 ALL 13 TOPICS MIXED (Adaptive)</option>
                        <option value="conversion">1. Fraction ↔ Percentage Conversions</option>
                        <option value="comparison">2. Percentage Comparisons (More/Less)</option>
                        <option value="multiplication_error">3. Multiplication Error % (LCM Method)</option>
                        <option value="fraction_mod">4. Fraction Numerator/Denominator Changes</option>
                        <option value="successive">5. Successive Change / AB Rule</option>
                        <option value="population">6. Population Change (Successive Ratio)</option>
                        <option value="income">7. Income & Expenditure (Direct vs Remaining)</option>
                        <option value="elections">8. Elections (Valid/Invalid/Did Not Vote)</option>
                        <option value="venn">9. Set Theory (Venn Diagrams)</option>
                        <option value="mixtures">10. Mixtures (Equating fixed quantities)</option>
                        <option value="exams">11. Exam Pass/Fail Marks</option>
                        <option value="breakage">12. Breakage Method (Male/Female diff rates)</option>
                        <option value="commission">13. Sales Commission (Tiered %)</option>
                    </select>
                </div>
            </div>

            <button class="start-btn" id="start-button" onclick="startQuiz()">Initialize Engine</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen">
            <div class="header-info">
                <div class="stat-badge score-box">Score: <span id="ui-score">0</span></div>
                <div class="stat-badge streak-box">🔥 Streak: <span id="ui-streak">0</span></div>
                <div class="stat-badge timer-box" id="ui-timer-container"><span id="ui-timer">05:00</span></div>
            </div>
            
            <div class="pace-container">
                <div class="pace-bar" id="ui-pace-bar"></div>
            </div>

            <div class="concept-hint" id="ui-concept-hint">Concept: Fractional Multipliers</div>
            <div class="question-box" id="ui-question">Loading question...</div>
            
            <div class="options-grid" id="ui-options"></div>

            <div id="ui-explanation-box">
                <strong style="color: var(--primary);">Concept Breakdown:</strong><br>
                <span id="ui-exp-text"></span>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-top: 1rem; gap: 1rem;">
                <button id="skip-btn" onclick="skipQuestion()" style="background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); box-shadow: none;">Skip Question</button>
                <button id="next-btn" onclick="nextQuestion()" disabled>Next Question ➔</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen">
            <h1>Session Complete</h1>
            
            <div class="summary-stats">
                <div class="stat-card"><div class="value" id="res-score">0</div><div class="label">Correct</div></div>
                <div class="stat-card"><div class="value" id="res-accuracy">0%</div><div class="label">Accuracy</div></div>
                <div class="stat-card"><div class="value" id="res-speed">0s</div><div class="label">Avg Time</div></div>
                <div class="stat-card"><div class="value" id="res-streak" style="color: var(--warning);">0</div><div class="label">Best Streak</div></div>
            </div>

            <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; color: var(--text-muted);">Weakest Concept: <span id="res-weakest" style="color: var(--danger);">None</span></h3>
            
            <div class="review-list" id="review-container"></div>

            <button class="start-btn" onclick="resetApp()">Return to Dashboard</button>
        </div>
    </div>

    <script>
        function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function gcd(a, b) { if (b === 0) return a; return gcd(b, a % b); }
        function lcm(a, b) { return (a * b) / gcd(a, b); }

        function shuffle(array) {
            var cur = array.length, rndI;
            while (cur > 0) {
                rndI = Math.floor(Math.random() * cur); cur--;
                var temp = array[cur]; array[cur] = array[rndI]; array[rndI] = temp;
            }
            return array;
        }

        function getUniqueOptions(opts) {
            var unique = [];
            for (var i = 0; i < opts.length; i++) {
                if (unique.indexOf(opts[i]) === -1) unique.push(opts[i]);
            }
            return unique;
        }

        var fractions = [
            { f: '1/2', p: 50 }, { f: '1/3', p: '33.33' }, { f: '2/3', p: '66.66' },
            { f: '1/4', p: 25 }, { f: '3/4', p: 75 }, { f: '1/5', p: 20 },
            { f: '2/5', p: 40 }, { f: '3/5', p: 60 }, { f: '4/5', p: 80 },
            { f: '1/6', p: '16.66' }, { f: '5/6', p: '83.33' }, { f: '1/7', p: '14.28' },
            { f: '2/7', p: '28.56' }, { f: '1/8', p: '12.5' }, { f: '3/8', p: '37.5' },
            { f: '5/8', p: '62.5' }, { f: '7/8', p: '87.5' }, { f: '1/9', p: '11.11' }, 
            { f: '2/9', p: '22.22' }, { f: '4/9', p: '44.44' }, { f: '5/9', p: '55.55' },
            { f: '1/11', p: '9.09' }, { f: '2/11', p: '18.18' }, { f: '3/11', p: '27.27' },
            { f: '1/12', p: '8.33' }, { f: '5/12', p: '41.66' }, { f: '1/15', p: '6.66' },
            { f: '1/16', p: '6.25' }
        ];

        var generators = {
            'conversion': function() {
                var f = fractions[rnd(0, fractions.length - 1)];
                var parts = f.f.split('/');
                var num = parseInt(parts[0]), den = parseInt(parts[1]);
                var multiplier = rnd(5, 80);
                var baseValue = den * multiplier;
                var answer = num * multiplier;
                
                var opts = [answer, answer + den, Math.abs(answer - den), answer * 2];
                for(var i=0; i<opts.length; i++) { if(opts[i] <= 0) opts[i] = opts[i] + den*2; }
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(opts[0] + rnd(1,10)*den); opts = getUniqueOptions(opts); }
                
                return {
                    id: 'conversion', type: 'Conversions',
                    q: "What is " + f.p + "% of " + baseValue + "?",
                    ans: answer, options: shuffle(opts),
                    exp: f.p + "% is equal to " + f.f + ". So, (" + f.f + ") * " + baseValue + " = " + answer + "."
                };
            },
            
            'comparison': function() {
                var f = fractions[rnd(0, fractions.length - 1)];
                var parts = f.f.split('/');
                var num = parseInt(parts[0]), den = parseInt(parts[1]);
                var isMore = rnd(0, 1) === 1;
                
                var qText, expText, ansPerc;
                if (isMore) {
                    var aParts = den + num, bParts = den;
                    ansPerc = ((num / aParts) * 100).toFixed(2);
                    qText = "If A's income is " + f.p + "% more than B's, by what percentage is B's less than A's? (Approx to 2 dec)";
                    expText = "Fraction is " + num + "/" + den + ". Let B = " + den + ". A = " + den + " + " + num + " = " + aParts + ". Difference = " + num + ". B is less than A by (" + num + "/" + aParts + ") * 100 = " + ansPerc + "%.";
                } else {
                    if (den <= num) return generators['comparison']();
                    var aParts = den - num, bParts = den;
                    ansPerc = ((num / aParts) * 100).toFixed(2);
                    qText = "If A's income is " + f.p + "% less than B's, by what percentage is B's more than A's? (Approx to 2 dec)";
                    expText = "Fraction is " + num + "/" + den + ". Let B = " + den + ". A = " + den + " - " + num + " = " + aParts + ". Difference = " + num + ". B is more than A by (" + num + "/" + aParts + ") * 100 = " + ansPerc + "%.";
                }
                
                var opts = [ansPerc + "%", (parseFloat(ansPerc) + 5).toFixed(2) + "%", (Math.abs(parseFloat(ansPerc) - 5)).toFixed(2) + "%", "50.00%"];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push((parseFloat(ansPerc) + rnd(1,10)).toFixed(2) + "%"); opts = getUniqueOptions(opts); }

                return { id: 'comparison', type: 'Comparisons', q: qText, ans: ansPerc + "%", options: shuffle(opts), exp: expText };
            },

            'multiplication_error': function() {
                var ds = [3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 16];
                var d1 = ds[rnd(0, ds.length-1)], d2 = ds[rnd(0, ds.length-1)];
                var n1 = rnd(1, d1 + 5), n2 = rnd(1, d2 + 5);
                
                if ((n1/d1) === (n2/d2)) return generators['multiplication_error']();
                
                var l = lcm(d1, d2);
                var correctVal = (l * n1) / d1;
                var wrongVal = (l * n2) / d2;
                var diff = Math.abs(correctVal - wrongVal);
                var errPerc = ((diff / correctVal) * 100).toFixed(2);
                
                var opts = [errPerc + "%", ((diff/wrongVal)*100).toFixed(2) + "%", (diff*2).toFixed(2) + "%", (parseFloat(errPerc)+10).toFixed(2) + "%"];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push((parseFloat(errPerc) + rnd(1,20)).toFixed(2) + "%"); opts = getUniqueOptions(opts); }

                return {
                    id: 'multiplication_error', type: 'Multiplication Error',
                    q: "A student multiplied a number by " + n2 + "/" + d2 + " instead of " + n1 + "/" + d1 + ". Find the percentage error in calculation. (Approx 2 dec)",
                    ans: errPerc + "%", options: shuffle(opts),
                    exp: "LCM Method: LCM of denominators (" + d1 + ", " + d2 + ") = " + l + ". Correct value = " + l + " * (" + n1 + "/" + d1 + ") = " + correctVal + ". Wrong value = " + l + " * (" + n2 + "/" + d2 + ") = " + wrongVal + ". Difference = " + diff + ". Error % = (" + diff + " / " + correctVal + ") * 100 = " + errPerc + "%."
                };
            },

            'fraction_mod': function() {
                var inc = rnd(1, 8)*10, dec = rnd(1, 5)*10, origN = rnd(2, 9), origD = rnd(3, 11);
                if (origN === origD) return generators['fraction_mod']();
                
                var newN_calc = origN * (100 + inc), newD_calc = origD * (100 - dec);
                var div = gcd(newN_calc, newD_calc);
                var finalN = newN_calc / div, finalD = newD_calc / div;
                
                var opts = [origN + "/" + origD, (origN+1) + "/" + origD, origD + "/" + origN, origN + "/" + (origD+1)];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(rnd(1,5) + "/" + rnd(2,10)); opts = getUniqueOptions(opts); }

                return {
                    id: 'fraction_mod', type: 'Fraction Alteration',
                    q: "If the numerator of a fraction is increased by " + inc + "% and the denominator is decreased by " + dec + "%, the resulting fraction is " + finalN + "/" + finalD + ". Find the original fraction.",
                    ans: origN + "/" + origD, options: shuffle(opts),
                    exp: "Let fraction be N/D. N becomes " + (100+inc) + "% of N, D becomes " + (100-dec) + "% of D. (N * " + (100+inc) + ") / (D * " + (100-dec) + ") = " + finalN + "/" + finalD + ". Cross-multiply to get N/D = " + origN + "/" + origD + "."
                };
            },

            'successive': function() {
                var c1 = rnd(1,9)*5, c2 = rnd(1,9)*5; 
                var v1 = rnd(0,1) ? c1 : -c1, v2 = rnd(0,1) ? c2 : -c2;
                var net = v1 + v2 + ((v1 * v2) / 100);
                var netStr = (net > 0 ? '+' : '') + net.toFixed(2) + "%";
                
                var wrongVal1 = (v1+v2>0?'+':'')+(v1+v2)+".00%", wrongVal2 = (Math.abs(net)).toFixed(2)+"%", wrongVal3 = ((v1+v2-((v1*v2)/100))>0?'+':'')+(v1+v2-((v1*v2)/100)).toFixed(2)+"%";
                var opts = [netStr, wrongVal1, wrongVal2, wrongVal3];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push((rnd(-50, 50)).toFixed(2) + "%"); opts = getUniqueOptions(opts); }

                var word1 = v1>0 ? 'increased' : 'decreased', word2 = v2>0 ? 'increased' : 'decreased';

                return {
                    id: 'successive', type: 'Successive Change',
                    q: "A value is " + word1 + " by " + Math.abs(v1) + "% and then " + word2 + " by " + Math.abs(v2) + "%. What is the net % change? (+ indicates inc, - indicates dec)",
                    ans: netStr, options: shuffle(opts),
                    exp: "AB Rule: a + b + (ab/100). (" + v1 + ") + (" + v2 + ") + ((" + v1 + " * " + v2 + ") / 100) = " + net.toFixed(2) + "%."
                };
            },

            'population': function() {
                var f1 = fractions[rnd(0, fractions.length-1)], f2 = fractions[rnd(0, fractions.length-1)];
                var n1 = parseInt(f1.f.split('/')[0]), d1 = parseInt(f1.f.split('/')[1]);
                var n2 = parseInt(f2.f.split('/')[0]), d2 = parseInt(f2.f.split('/')[1]);
                
                var isInc1 = rnd(0,1) === 1, isInc2 = rnd(0,1) === 1;
                var mult1_n = isInc1 ? d1 + n1 : d1 - n1, mult2_n = isInc2 ? d2 + n2 : d2 - n2;
                
                var baseMultiplier = rnd(1, 20) * 100;
                var pPop = d1 * d2 * baseMultiplier, newPop = mult1_n * mult2_n * baseMultiplier;
                
                var opts = [newPop, newPop+500, Math.abs(newPop-1000), newPop*2];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(opts[0] + rnd(1,10)*100); opts = getUniqueOptions(opts); }
                
                var w1 = isInc1 ? 'increases' : 'decreases', w2 = isInc2 ? 'increases' : 'decreases';

                return {
                    id: 'population', type: 'Population Change',
                    q: "A town's population is " + pPop + ". It " + w1 + " by " + f1.p + "% during the 1st year and " + w2 + " by " + f2.p + "% during the 2nd year. What is the population after 2 years?",
                    ans: newPop, options: shuffle(opts),
                    exp: f1.p + "% = " + f1.f + ", " + f2.p + "% = " + f2.f + ". Multipliers are " + mult1_n + "/" + d1 + " and " + mult2_n + "/" + d2 + ". Pop = " + pPop + " * (" + mult1_n + "/" + d1 + ") * (" + mult2_n + "/" + d2 + ") = " + newPop + "."
                };
            },

            'income': function() {
                var s1 = rnd(1, 5)*10, s2 = rnd(1, 6)*10; 
                var inc = rnd(5, 50)*1000;
                var save = (inc * (100-s1) * (100-s2)) / 10000;
                
                var opts = [inc, inc+5000, Math.abs(inc-2000), inc*2];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(opts[0] + rnd(1,10)*1000); opts = getUniqueOptions(opts); }
                
                return {
                    id: 'income', type: 'Income (Remaining %)',
                    q: "A man spends " + s1 + "% of income on rent, and " + s2 + "% of the REMAINING on food. If he saves ₹" + save + ", what is his total income?",
                    ans: inc, options: shuffle(opts),
                    exp: "Remaining concept: Income * " + (100-s1) + "/100 * " + (100-s2) + "/100 = " + save + ". Solving gives Income = ₹" + inc + "."
                };
            },

            'elections': function() {
                var dnv = rnd(0, 5) * 5, inv = rnd(0, 4) * 5, wShare = rnd(51, 80); 
                var diffShare = wShare - (100 - wShare); 
                var tot = rnd(5, 50) * 10000; 
                var majority = (tot * (100-dnv)/100 * (100-inv)/100 * diffShare) / 100;
                
                var opts = [tot, tot+5000, Math.abs(tot-2000), Math.floor(tot*1.2)];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(opts[0] + rnd(1,10)*1000); opts = getUniqueOptions(opts); }

                return {
                    id: 'elections', type: 'Elections',
                    q: "In an election, " + dnv + "% voters did not cast votes, and " + inv + "% of cast votes were invalid. The winner secured " + wShare + "% of VALID votes and won by " + majority + " votes. Total voters in voting list?",
                    ans: tot, options: shuffle(opts),
                    exp: "Winner got " + wShare + "%, loser " + (100-wShare) + "%. Diff = " + diffShare + "% of Valid. Total * (" + (100-dnv) + "/100) [cast] * (" + (100-inv) + "/100) [valid] * (" + diffShare + "/100) [majority] = " + majority + ". Total = " + tot + "."
                };
            },

            'venn': function() {
                var failBoth = rnd(5, 25), passBoth = rnd(15, 45), pass1 = rnd(50, 80);
                var pAtLeastOne = 100 - failBoth;
                var pass2 = pAtLeastOne + passBoth - pass1; 
                
                if (pass2 < passBoth || pass1 < passBoth) return generators['venn'](); 
                
                var opts = [passBoth+"%", (passBoth+10)+"%", Math.abs(passBoth-5)+"%", Math.abs(passBoth-15)+"%"];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(rnd(10,50) + "%"); opts = getUniqueOptions(opts); }
                
                return {
                    id: 'venn', type: 'Venn Diagram',
                    q: "In an exam, " + pass1 + "% passed in Math, " + pass2 + "% passed in English, and " + failBoth + "% failed in both. What % passed in BOTH subjects?",
                    ans: passBoth+"%", options: shuffle(opts),
                    exp: "Total passed (at least one) = 100% - " + failBoth + "%(failed both) = " + pAtLeastOne + "%. Passed Both = Pass(Math) + Pass(Eng) - Pass(Total) = " + pass1 + " + " + pass2 + " - " + pAtLeastOne + " = " + passBoth + "%."
                };
            },

            'mixtures': function() {
                var a1 = rnd(2, 7) * 10, a2 = a1 + rnd(1, 2)*10; 
                var w1 = 100 - a1, w2 = 100 - a2;
                
                var t = w2 * rnd(1, 5) * 2; 
                var wL = (t * w1) / 100;
                var newT = wL / (w2 / 100);
                var add = newT - t;
                
                var opts = [add, add+10, Math.abs(add-5), add+20];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(opts[0] + rnd(1,10)); opts = getUniqueOptions(opts); }
                
                return {
                    id: 'mixtures', type: 'Mixtures',
                    q: "A " + t + "L mixture contains " + a1 + "% alcohol. How much pure alcohol must be added to make it " + a2 + "% alcohol?",
                    ans: add, options: shuffle(opts),
                    exp: "Equate Water (fixed). Initial water = " + (100-a1) + "% of " + t + " = " + wL + "L. In new mix, water is " + (100-a2) + "%. So " + (100-a2) + "% of New Total = " + wL + ". New Total = " + newT + ". Added = " + newT + " - " + t + " = " + add + "L."
                };
            },

            'exams': function() {
                var p1 = rnd(20, 40), p2 = p1 + rnd(5, 25);
                var max = rnd(3, 10)*100;
                var diffMarks = (max * (p2 - p1)) / 100;
                
                var failMarks = rnd(5, diffMarks - 5), extra = diffMarks - failMarks;
                
                var opts = [max, max+100, Math.abs(max-150), max+250];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(opts[0] + rnd(1,5)*50); opts = getUniqueOptions(opts); }
                
                return {
                    id: 'exams', type: 'Exam Pass Marks',
                    q: "Student A scores " + p1 + "% and fails by " + failMarks + " marks. Student B scores " + p2 + "% and passes by " + extra + " marks. Find max marks.",
                    ans: max, options: shuffle(opts),
                    exp: "Difference in % = " + (p2-p1) + "%. Difference in marks = " + failMarks + " + " + extra + " = " + (failMarks+extra) + ". So, " + (p2-p1) + "% of Max = " + (failMarks+extra) + ". Max = " + max + "."
                };
            },

            'breakage': function() {
                var tot = rnd(4, 15)*1000, m = rnd(1, (tot/1000)-1)*1000, f = tot - m;
                var incM = rnd(2, 9), extra = rnd(1, 5), incF = incM + extra;
                var newTot = tot + (m*incM/100) + (f*incF/100);
                
                var opts = [f, m, f+500, Math.abs(tot/2)];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(opts[0] + rnd(1,5)*100); opts = getUniqueOptions(opts); }
                
                return {
                    id: 'breakage', type: 'Breakage Method',
                    q: "Town population is " + tot + ". Males increase by " + incM + "% and Females by " + incF + "%. New population is " + newTot + ". Find initial number of females.",
                    ans: f, options: shuffle(opts),
                    exp: "Breakage: Female inc = " + incM + "% + " + extra + "%. If both inc by " + incM + "%, new total inc = " + incM + "% of " + tot + " = " + (tot*incM/100) + ". Actual inc = " + (newTot-tot) + ". Extra = " + ((newTot-tot) - (tot*incM/100)) + ". This extra is " + extra + "% of Females. F = " + f + "."
                };
            },

            'commission': function() {
                var thresholds = [5000, 8000, 10000, 12000, 15000, 20000];
                var t1 = thresholds[rnd(0, thresholds.length-1)];
                var p1 = rnd(12, 20), p2 = p1 - rnd(2, 5); 
                var totalSales = t1 + rnd(5, 30)*1000;
                
                var extraC = (p1 - p2) * t1 / 100;
                var totalC = (p2 * totalSales / 100) + extraC;
                var dep = totalSales - totalC;
                
                var opts = [totalSales, totalSales+2000, Math.abs(totalSales-5000), Math.floor(totalSales*1.5)];
                opts = getUniqueOptions(opts);
                while(opts.length < 4) { opts.push(opts[0] + rnd(1,5)*1000); opts = getUniqueOptions(opts); }
                
                return {
                    id: 'commission', type: 'Commission',
                    q: "A salesman gets " + p1 + "% commission up to ₹" + t1 + " sales and " + p2 + "% on sales above ₹" + t1 + ". If he deposits ₹" + dep + " in company after deducting his commission, find total sales.",
                    ans: totalSales, options: shuffle(opts),
                    exp: "Breakage: Assume flat " + p2 + "% commission on everything. He loses " + (p1-p2) + "% on first ₹" + t1 + ", which is ₹" + extraC + ". If he gets flat " + p2 + "%, he deposits ₹" + extraC + " MORE. New Deposit = " + dep + " + " + extraC + ". Since company gets flat " + (100-p2) + "%, " + (100-p2) + "% of Total = " + (dep + extraC) + ". Total = ₹" + totalSales + "."
                };
            }
        };

        var state = {
            mode: 'train', timeRemaining: 300, timerId: null,
            questionsAttempted: 0, correctAnswers: 0, streak: 0, maxStreak: 0,
            history: [], currentQ: null, qStartTime: 0, paceTime: 30, focus: 'all',
            weights: {}, errorCounts: {}, isTransitioning: false
        };

        function startQuiz() {
            try {
                state.mode = document.getElementById('quiz-mode').value;
                var dur = parseInt(document.getElementById('quiz-duration').value);
                state.timeRemaining = dur;
                state.paceTime = 30; // 40 seconds target for all questions (strict auto-skip in Exam mode)
                state.isTransitioning = false;
                
                document.getElementById('ui-timer-container').style.display = (dur === 999999) ? 'none' : 'block';
                
                state.focus = document.getElementById('quiz-concept').value;
                state.questionsAttempted = 0; state.correctAnswers = 0; state.streak = 0; state.maxStreak = 0;
                state.history = [];
                
                state.weights = {}; state.errorCounts = {};
                var genKeys = Object.keys(generators);
                for(var i=0; i<genKeys.length; i++) {
                    var k = genKeys[i];
                    if (state.focus === 'all' || state.focus === k) {
                        state.weights[k] = 1; 
                        state.errorCounts[k] = 0;
                    }
                }
                
                document.getElementById('start-screen').classList.remove('active');
                document.getElementById('quiz-screen').classList.add('active');
                
                if(dur !== 999999) {
                    state.timerId = setInterval(tick, 1000);
                }
                generateNextQuestion();
            } catch (e) {
                alert("Error starting test: " + e.message);
                console.error(e);
            }
        }

        function tick() {
            state.timeRemaining--;
            updateUITimer();
            
            var elapsed = (performance.now() - state.qStartTime) / 1000;
            var pacePct = Math.max(0, 100 - (elapsed / state.paceTime) * 100);
            var bar = document.getElementById('ui-pace-bar');
            bar.style.width = pacePct + '%';
            
            if (pacePct < 30) { bar.className = 'pace-bar danger'; }
            else if (pacePct < 60) { bar.className = 'pace-bar warning'; }
            else { bar.className = 'pace-bar'; }

            // V6 EXAM MODE STRICT TIMEOUT: Auto-skip when pace bar hits 0
            if (state.mode === 'exam' && pacePct <= 0 && !state.isTransitioning) {
                timeOutQuestion();
            }

            if (state.timeRemaining <= 0) endQuiz();
        }

        function updateUITimer() {
            var m = Math.floor(state.timeRemaining / 60);
            var s = state.timeRemaining % 60;
            var minStr = m < 10 ? '0' + m : m;
            var secStr = s < 10 ? '0' + s : s;
            document.getElementById('ui-timer').innerText = minStr + ":" + secStr;
            document.getElementById('ui-streak').innerText = state.streak;
            document.getElementById('ui-score').innerText = state.correctAnswers;
        }

        function getWeightedRandomConcept() {
            var genKeys = Object.keys(state.weights);
            var totalWeight = 0;
            for(var i=0; i<genKeys.length; i++) totalWeight += state.weights[genKeys[i]];
            
            var random = Math.random() * totalWeight;
            for(var j=0; j<genKeys.length; j++) {
                var concept = genKeys[j];
                random -= state.weights[concept];
                if (random <= 0) return concept;
            }
            return genKeys[0];
        }

        function generateNextQuestion() {
            state.isTransitioning = false;
            document.getElementById('ui-explanation-box').style.display = 'none';
            document.getElementById('skip-btn').disabled = false;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('ui-pace-bar').style.width = '100%';
            
            if(document.getElementById('quiz-duration').value == 999999) {
                requestAnimationFrame(updatePaceBarLoop);
            }

            var concept = getWeightedRandomConcept();
            state.currentQ = generators[concept]();
            state.qStartTime = performance.now();

            document.getElementById('ui-concept-hint').innerText = "Concept: " + state.currentQ.type;
            document.getElementById('ui-question').innerText = state.currentQ.q;
            
            var optsContainer = document.getElementById('ui-options');
            optsContainer.innerHTML = '';
            
            for(var i=0; i<state.currentQ.options.length; i++) {
                (function(opt) {
                    var btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = function() { selectOption(opt, btn); };
                    optsContainer.appendChild(btn);
                })(state.currentQ.options[i]);
            }
        }
        
        function updatePaceBarLoop() {
            if(document.getElementById('quiz-screen').classList.contains('active') && document.getElementById('quiz-duration').value == 999999) {
                var elapsed = (performance.now() - state.qStartTime) / 1000;
                var pacePct = Math.max(0, 100 - (elapsed / state.paceTime) * 100);
                var bar = document.getElementById('ui-pace-bar');
                bar.style.width = pacePct + '%';
                if (pacePct < 30) bar.className = 'pace-bar danger'; 
                else if (pacePct < 60) bar.className = 'pace-bar warning'; 
                else bar.className = 'pace-bar';
                requestAnimationFrame(updatePaceBarLoop);
            }
        }

        function selectOption(selectedOpt, btnElement) {
            state.isTransitioning = true;
            var timeTaken = Math.round(performance.now() - state.qStartTime);
            var isCorrect = (selectedOpt == state.currentQ.ans);
            
            var buttons = document.querySelectorAll('.option-btn');
            for(var i=0; i<buttons.length; i++) {
                var b = buttons[i];
                b.disabled = true;
                if (b.innerText == state.currentQ.ans) b.classList.add('correct');
                else if (b === btnElement && !isCorrect) b.classList.add('wrong');
            }

            state.questionsAttempted++;
            document.getElementById('skip-btn').disabled = true;
            document.getElementById('next-btn').disabled = false;

            if (isCorrect) {
                state.correctAnswers++;
                state.streak++;
                state.maxStreak = Math.max(state.maxStreak, state.streak);
                state.weights[state.currentQ.id] = Math.max(0.5, state.weights[state.currentQ.id] - 0.2);
            } else {
                state.streak = 0;
                state.weights[state.currentQ.id] += 1.5;
                state.errorCounts[state.currentQ.id]++;
                
                if (state.mode === 'train') {
                    document.getElementById('ui-explanation-box').style.display = 'block';
                    document.getElementById('ui-exp-text').innerText = state.currentQ.exp;
                }
            }
            
            updateUITimer();
            
            var histItem = {
                id: state.currentQ.id, type: state.currentQ.type, q: state.currentQ.q,
                ans: state.currentQ.ans, exp: state.currentQ.exp,
                userAns: selectedOpt, timeTakenMs: timeTaken, isCorrect: isCorrect, skipped: false
            };
            state.history.push(histItem);
            
            if (state.mode === 'exam') { setTimeout(generateNextQuestion, 800); }
        }

        function skipQuestion() {
            state.isTransitioning = true;
            var timeTaken = Math.round(performance.now() - state.qStartTime);
            state.questionsAttempted++; 
            state.streak = 0;
            state.weights[state.currentQ.id] += 1.0; 
            state.errorCounts[state.currentQ.id]++;
            
            var histItem = {
                id: state.currentQ.id, type: state.currentQ.type, q: state.currentQ.q,
                ans: state.currentQ.ans, exp: state.currentQ.exp,
                userAns: "Skipped ⏭", timeTakenMs: timeTaken, isCorrect: false, skipped: true
            };
            state.history.push(histItem);
            
            updateUITimer();
            generateNextQuestion();
        }

        function timeOutQuestion() {
            state.isTransitioning = true;
            var timeTaken = Math.round(performance.now() - state.qStartTime);
            state.questionsAttempted++; 
            state.streak = 0;
            state.weights[state.currentQ.id] += 1.0; 
            state.errorCounts[state.currentQ.id]++;
            
            var histItem = {
                id: state.currentQ.id, type: state.currentQ.type, q: state.currentQ.q,
                ans: state.currentQ.ans, exp: state.currentQ.exp,
                userAns: "Time Out ⏱️", timeTakenMs: timeTaken, isCorrect: false, skipped: true
            };
            state.history.push(histItem);
            
            updateUITimer();
            generateNextQuestion();
        }

        function nextQuestion() { generateNextQuestion(); }

        function endQuiz() {
            clearInterval(state.timerId);
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            renderResults();
        }

        function renderResults() {
            document.getElementById('res-score').innerText = state.correctAnswers + "/" + state.questionsAttempted;
            var acc = state.questionsAttempted > 0 ? Math.round((state.correctAnswers / state.questionsAttempted) * 100) : 0;
            document.getElementById('res-accuracy').innerText = acc + "%";
            document.getElementById('res-streak').innerText = state.maxStreak;
            
            var totalMs = 0;
            for(var i=0; i<state.history.length; i++) totalMs += state.history[i].timeTakenMs;
            var avgS = state.questionsAttempted > 0 ? (totalMs / state.questionsAttempted / 1000).toFixed(1) : 0;
            document.getElementById('res-speed').innerText = avgS + "s";

            var weakest = "None", maxErr = 0;
            var eKeys = Object.keys(state.errorCounts);
            for (var j=0; j<eKeys.length; j++) {
                var key = eKeys[j];
                if (state.errorCounts[key] > maxErr) {
                    maxErr = state.errorCounts[key];
                    weakest = key.charAt(0).toUpperCase() + key.slice(1).replace('_', ' ');
                }
            }
            document.getElementById('res-weakest').innerText = weakest + (maxErr > 0 ? " (" + maxErr + " errors)" : " - Perfect!");

            var list = document.getElementById('review-container');
            list.innerHTML = '';
            
            if (state.history.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No questions attempted.</p>';
                return;
            }

            for(var k=0; k<state.history.length; k++) {
                var item = state.history[k];
                var div = document.createElement('div');
                div.className = "review-item " + (item.skipped ? 'skipped' : (item.isCorrect ? 'correct' : 'incorrect'));
                
                var s = item.timeTakenMs / 1000;
                var speedClass = 'speed-ok', speedText = 'Avg Pace';
                if (s < 15) { speedClass = 'speed-fast'; speedText = 'Lightning Fast ⚡'; }
                else if (s > 45) { speedClass = 'speed-slow'; speedText = 'Needs Practice 🐢'; }

                var ansHtml = "Your Answer: <span style='color: " + (item.skipped ? 'var(--text-muted)' : (item.isCorrect ? 'var(--success)' : 'var(--danger)')) + "'>" + item.userAns + "</span>";
                if (!item.isCorrect || item.skipped) {
                    ansHtml += " | Correct Answer: <span style='color: var(--success)'>" + item.ans + "</span>";
                }

                div.innerHTML = "<div class='review-q'>Q" + (k + 1) + ": " + item.q + "</div>" +
                                "<div class='review-a'>" + ansHtml + "</div>" +
                                "<div class='explanation'>" + item.exp + "</div>" +
                                "<div class='review-meta'>" +
                                "<span>Concept: " + item.type + "</span>" +
                                "<span><span class='speed-badge " + speedClass + "'>" + speedText + "</span> Time: " + s.toFixed(1) + "s</span>" +
                                "</div>";
                list.appendChild(div);
            }
        }

        function resetApp() {
            if(state.timerId) clearInterval(state.timerId);
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        }
    </script>
</body>
